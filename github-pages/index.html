<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pamoja IQ</title>
    <style>
      :root {
        color-scheme: light;
        --navy: #0f2a3d;
        --ink: #14202b;
        --muted: #5b6b78;
        --line: #dce2e7;
        --canvas: #f5f7f9;
        --surface: #ffffff;
        --accent: #1e6f5c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: var(--canvas);
        color: var(--ink);
      }
      main { max-width: 42rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
      header { display: flex; align-items: center; gap: 0.75rem; }
      .mark {
        width: 2.25rem; height: 2.25rem; border-radius: 0.5rem;
        background: var(--accent); color: white; display: grid; place-items: center;
        font-weight: 600;
      }
      h1 { margin: 4rem 0 0; font-size: 2rem; line-height: 1.2; font-weight: 600; max-width: 36rem; }
      .lead { margin: 1rem 0 0; font-size: 1.125rem; color: var(--muted); max-width: 36rem; }
      .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 2rem; }
      a.btn, a.ghost {
        display: inline-flex; align-items: center; min-height: 2.75rem; padding: 0 1.25rem;
        border-radius: 0.5rem; text-decoration: none; font-weight: 600; font-size: 0.95rem;
      }
      a.btn { background: var(--navy); color: white; }
      a.ghost { border: 1px solid var(--line); background: var(--surface); color: var(--navy); }
      ul { margin: 3rem 0 0; padding: 0; list-style: none; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
      li { padding: 1rem 0; border-top: 1px solid var(--line); }
      li:first-child { border-top: 0; }
      .name { margin: 0; font-weight: 600; }
      .tag { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="mark">P</div>
        <div>
          <p class="name">Pamoja IQ</p>
          <p class="tag">Intelligent Chama Solution</p>
        </div>
      </header>
      <h1>Clear, private records for every chama member.</h1>
      <p class="lead">The treasurer keeps one set of books. Each member opens only their own account.</p>
      <div class="actions">
        <a class="btn" href="member.html">Sign in</a>
        <a class="ghost" href="treasurer.html">For treasurers</a>
      </div>
      <ul>
        <li>Upload records</li>
        <li>Members see only their own account</li>
        <li>Reminders before due dates</li>
      </ul>
    </main>
  </body>
</html>
